<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD FloatingWidget v1.0</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype");
  font-weight: 500 700; font-display: swap;
}
:root {
  --bg: #FFFFFF; --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
  --accent: #00C48C; --accent-text: #007A55; --accent-glass: rgba(0,196,140,0.14);
  --accent-border: rgba(0,196,140,0.25);
  --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(0,0,0,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --font: "LXGW WenKai", "霞鹜文楷", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 20px 60px; }
.lang-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-highlight); margin-bottom: 20px; }
.lang-toggle button { border: none; background: transparent; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-glass); border: 0.5px solid var(--accent-border); color: var(--accent-text); }
.changelog { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 16px 20px; margin-bottom: 24px; }
.cl-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 1px; margin-bottom: 12px; }
.cl-ver { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cl-ver .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-glass); border: 0.5px solid var(--accent-border); border-radius: 999px; padding: 1px 8px; }
.cl-date { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.cl-list { list-style: none; }
.cl-list li { font-size: 13.5px; color: var(--text-2); line-height: 1.7; padding-left: 14px; position: relative; }
.cl-list li::before { content: ''; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.sec-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
.tip { font-size: 12.5px; color: var(--text-3); margin-bottom: 14px; }
/* 演示舞台：模拟一个页面容器，悬浮控件在其中移动 */
.stage {
  position: relative; height: 420px; border-radius: 24px;
  background: #F5F5F7; border: 0.5px solid #E5E5EA; overflow: hidden;
}
.pos-btn { position: absolute; z-index: 3; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
.pos-btn button { border: 0.5px solid var(--glass-border); background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--text-2); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.pos-btn button.active { background: var(--accent-glass); border-color: var(--accent-border); color: var(--accent-text); }
/* 悬浮控件本体：纯悬浮骨架（无玻璃、无手势，仅定位） */
.float-core {
  position: absolute; z-index: 2;
  display: flex; align-items: center; gap: 8px;
  padding: 14px 20px; border-radius: 999px;
  background: #FFFFFF; border: 2px dashed var(--accent);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  transition: all 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
  font-size: 13px; font-weight: 700; color: var(--accent-text);
}
.float-core svg { width: 18px; height: 18px; }
.fc-bottomCenter { bottom: 16px; left: 50%; transform: translateX(-50%); }
.fc-bottomLeft { bottom: 16px; left: 16px; }
.fc-bottomRight { bottom: 16px; right: 16px; }
.fc-topCenter { top: 16px; left: 50%; transform: translateX(-50%); }
.fc-topLeft { top: 16px; left: 16px; }
.fc-topRight { top: 16px; right: 16px; }
.status { margin-top: 16px; text-align: center; font-size: 13px; color: var(--text-2); }
.status b { color: var(--accent-text); font-weight: 700; }
</style>
</head>
<body>
<main class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <section class="changelog">
    <div class="cl-title" id="clTitle">更新日志 CHANGELOG</div>
    <div class="cl-ver" id="clVer"></div>
    <ul class="cl-list" id="clList"></ul>
  </section>

  <div class="sec-title" id="secTitle">悬浮控件 · 纯悬浮骨架（无玻璃、无手势）</div>
  <div class="tip" id="secTip">点击位置按钮，观察悬浮控件在舞台内的定位变化。虚线边框 = 只演示悬浮容器本身。</div>
  <div class="stage">
    <div class="pos-btn">
      <button type="button" class="active" data-pos="bottomCenter" id="b0">底部居中</button>
      <button type="button" data-pos="bottomLeft" id="b1">底部左</button>
      <button type="button" data-pos="bottomRight" id="b2">底部右</button>
      <button type="button" data-pos="topCenter" id="b3">顶部居中</button>
      <button type="button" data-pos="topLeft" id="b4">顶部左</button>
      <button type="button" data-pos="topRight" id="b5">顶部右</button>
    </div>
    <div class="float-core" id="floatCore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      <span id="fcLabel">悬浮件</span>
    </div>
  </div>
  <div class="status" id="status">位置：<b id="statusPos">底部居中</b></div>
</main>

<script>
(function () {
  'use strict';
  var I18N = {
    zh: {
      clTitle: '更新日志 CHANGELOG',
      clVer: 'v1.0 <span class="tag">悬浮独立</span><span class="cl-date">2026-10-13</span>',
      clItems: ['悬浮控件原子件：悬浮定位（底部/角落/居中）/ 边距 / 层级，保持浮层', '不渲染玻璃、不带手势——纯悬浮骨架，可装任意内容'],
      secTitle: '悬浮控件 · 纯悬浮骨架（无玻璃、无手势）',
      secTip: '点击位置按钮，观察悬浮控件在舞台内的定位变化。虚线边框 = 只演示悬浮容器本身。',
      label: '悬浮件', pos: '位置：', posName: { bottomCenter: '底部居中', bottomLeft: '底部左', bottomRight: '底部右', topCenter: '顶部居中', topLeft: '顶部左', topRight: '顶部右' }
    },
    en: {
      clTitle: 'CHANGELOG',
      clVer: 'v1.0 <span class="tag">Float Standalone</span><span class="cl-date">2026-10-13</span>',
      clItems: ['Floating widget atom: floating position (bottom/corner/center) / offset / z-index, keeps overlay', 'No glass, no gestures — pure floating skeleton, holds any content'],
      secTitle: 'Floating Widget · pure skeleton (no glass, no gestures)',
      secTip: 'Click position buttons to move the floating widget. Dashed border = demonstrating the floating container only.',
      label: 'Floating', pos: 'Position: ', posName: { bottomCenter: 'Bottom Center', bottomLeft: 'Bottom Left', bottomRight: 'Bottom Right', topCenter: 'Top Center', topLeft: 'Top Left', topRight: 'Top Right' }
    }
  };
  var lang = 'zh';
  var btns = Array.prototype.slice.call(document.getElementById('langToggle').querySelectorAll('button'));
  var posBtns = Array.prototype.slice.call(document.querySelectorAll('.pos-btn button'));
  var core = document.getElementById('floatCore');

  function render() {
    var d = I18N[lang];
    document.getElementById('clTitle').textContent = d.clTitle;
    document.getElementById('clVer').innerHTML = d.clVer;
    document.getElementById('clList').innerHTML = d.clItems.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    document.getElementById('secTitle').textContent = d.secTitle;
    document.getElementById('secTip').textContent = d.secTip;
    document.getElementById('fcLabel').textContent = d.label;
    document.getElementById('statusPos').textContent = d.posName[currentPos] || currentPos;
    document.getElementById('status').innerHTML = d.pos + '<b>' + (d.posName[currentPos] || currentPos) + '</b>';
    // 位置按钮文案（内置双语）
    var labels = lang === 'zh'
      ? ['底部居中', '底部左', '底部右', '顶部居中', '顶部左', '顶部右']
      : ['Bottom Center', 'Bottom Left', 'Bottom Right', 'Top Center', 'Top Left', 'Top Right'];
    posBtns.forEach(function (b, i) { b.textContent = labels[i]; });
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
  }
  var currentPos = 'bottomCenter';
  posBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      currentPos = b.getAttribute('data-pos');
      core.className = 'float-core fc-' + currentPos;
      posBtns.forEach(function (x) { x.classList.toggle('active', x === b); });
      render();
    });
  });
  btns.forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); });
  });
  render();
})();
</script>
</body>
</html>
