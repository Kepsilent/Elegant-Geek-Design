<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD Spot v1.0</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype");
  font-weight: 500 700; font-display: swap;
}
:root {
  --bg: #FFFFFF; --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
  --accent: #00C48C; --accent-text: #007A55; --accent-glass: rgba(0,196,140,0.14);
  --accent-border: rgba(0,196,140,0.25);
  --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(0,0,0,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --font: "LXGW WenKai", "霞鹜文楷", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
.lang-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-highlight); margin-bottom: 20px; }
.lang-toggle button { border: none; background: transparent; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-glass); border: 0.5px solid var(--accent-border); color: var(--accent-text); }
.changelog { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 16px 20px; margin-bottom: 24px; }
.cl-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 1px; margin-bottom: 12px; }
.cl-ver { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cl-ver .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-glass); border: 0.5px solid var(--accent-border); border-radius: 999px; padding: 1px 8px; }
.cl-date { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.cl-list { list-style: none; }
.cl-list li { font-size: 13.5px; color: var(--text-2); line-height: 1.7; padding-left: 14px; position: relative; }
.cl-list li::before { content: ''; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.sec-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
.stage { border-radius: 24px; background: linear-gradient(135deg, #F0F9F5 0%, #E8F2EF 40%, #DCEFE8 100%); border: 0.5px solid #E5E5EA; padding: 40px 20px; display: flex; align-items: center; justify-content: center; gap: 24px; min-height: 220px; }
.spot { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.55); border: 0.5px solid rgba(0,0,0,0.08); box-shadow: var(--glass-shadow), var(--glass-highlight); display: flex; align-items: center; justify-content: center; color: var(--accent-text); cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1); -webkit-tap-highlight-color: transparent; }
.spot.pressed { transform: scale(1.08); }
.spot svg { width: 26px; height: 26px; }
.spot.big { width: 80px; height: 80px; }
.spot.big svg { width: 32px; height: 32px; }
.hint { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.hint .key { display: inline-block; background: var(--accent-glass); color: var(--accent-text); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <section class="changelog">
    <div class="cl-title" id="clTitle">更新日志 CHANGELOG</div>
    <div class="cl-ver" id="clVer"></div>
    <ul class="cl-list" id="clList"></ul>
  </section>

  <div class="sec-title" id="secTitle">悬浮圆钮 EGDSpot · 按压放大 / 松手回弹</div>
  <div class="stage">
    <div class="spot" id="spotA" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg></div>
    <div class="spot big" id="spotB" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>
  </div>
  <div class="hint" id="hint">按住圆钮 → <span class="key">放大 1.08×</span>；松手 → 弹性回弹</div>
</main>

<script>
(function () {
  'use strict';
  var I18N = {
    zh: {
      clTitle: '更新日志 CHANGELOG',
      clVer: 'v1.0 <span class="tag">按压回弹</span><span class="cl-date">2026-10-24</span>',
      clItems: ['悬浮圆钮原子件 v1.0「按压回弹」：圆形按钮基座，按压放大 1.08×、松手回弹（easeOutBack）、点击回调', '极简边界：材质交给 EGDLiquidGlass、悬浮交给 EGDFloatingWidget、拖动交给 EGDDragSwipe'],
      secTitle: '悬浮圆钮 EGDSpot · 按压放大 / 松手回弹',
      hint: '按住圆钮 → <span class="key">放大 1.08×</span>；松手 → 弹性回弹'
    },
    en: {
      clTitle: 'CHANGELOG',
      clVer: 'v1.0 <span class="tag">Press Bounce</span><span class="cl-date">2026-10-24</span>',
      clItems: ['Spot atom v1.0 "Press Bounce": round button base, press scales 1.08×, release bounces (easeOutBack), tap callback', 'Minimal: material via EGDLiquidGlass, floating via EGDFloatingWidget, dragging via EGDDragSwipe'],
      secTitle: 'Floating Spot EGDSpot · press scale / release bounce',
      hint: 'Press & hold → <span class="key">scale 1.08×</span>; release → elastic bounce'
    }
  };
  var lang = 'zh';
  var btns = Array.prototype.slice.call(document.getElementById('langToggle').querySelectorAll('button'));
  var spots = Array.prototype.slice.call(document.querySelectorAll('.spot'));
  spots.forEach(function (s) {
    s.addEventListener('pointerdown', function () { s.classList.add('pressed'); });
    s.addEventListener('pointerup', function () { s.classList.remove('pressed'); });
    s.addEventListener('pointercancel', function () { s.classList.remove('pressed'); });
    s.addEventListener('pointerleave', function () { s.classList.remove('pressed'); });
    s.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') s.classList.add('pressed'); });
    s.addEventListener('keyup', function () { s.classList.remove('pressed'); });
  });
  function render() {
    var d = I18N[lang];
    document.getElementById('clTitle').textContent = d.clTitle;
    document.getElementById('clVer').innerHTML = d.clVer;
    document.getElementById('clList').innerHTML = d.clItems.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    document.getElementById('secTitle').textContent = d.secTitle;
    document.getElementById('hint').innerHTML = d.hint;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); }); });
  render();
})();
</script>
</body>
</html>
