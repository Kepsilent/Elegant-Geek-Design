<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD SpotIndicator v1.0</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype");
  font-weight: 500 700; font-display: swap;
}
:root {
  --bg: #FFFFFF; --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
  --accent: #00C48C; --accent-text: #007A55; --accent-glass: rgba(0,196,140,0.14);
  --accent-border: rgba(0,196,140,0.25);
  --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(0,0,0,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --font: "LXGW WenKai", "霞鹜文楷", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
.lang-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-highlight); margin-bottom: 20px; }
.lang-toggle button { border: none; background: transparent; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-glass); border: 0.5px solid var(--accent-border); color: var(--accent-text); }
.changelog { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 16px 20px; margin-bottom: 24px; }
.cl-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 1px; margin-bottom: 12px; }
.cl-ver { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cl-ver .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-glass); border: 0.5px solid var(--accent-border); border-radius: 999px; padding: 1px 8px; }
.cl-date { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.cl-list { list-style: none; }
.cl-list li { font-size: 13.5px; color: var(--text-2); line-height: 1.7; padding-left: 14px; position: relative; }
.cl-list li::before { content: ''; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.sec-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
.stage { border-radius: 24px; background: linear-gradient(135deg, #F0F9F5 0%, #E8F2EF 40%, #DCEFE8 100%); border: 0.5px solid #E5E5EA; padding: 40px 20px; display: flex; align-items: center; justify-content: center; gap: 32px; min-height: 220px; }
.frame-item { position: relative; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; }
.frame { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.10); backdrop-filter: blur(18px) saturate(190%) brightness(1.08); -webkit-backdrop-filter: blur(18px) saturate(190%) brightness(1.08); box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -3px 8px rgba(255,255,255,0.2), inset 0 0 12px rgba(0,0,0,0.05), 0 4px 18px rgba(0,0,0,0.08); transition: transform 300ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 200ms ease; }
.frame::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 210deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.45) 45deg, rgba(255,255,255,0.06) 100deg, rgba(255,255,255,0) 180deg, rgba(255,255,255,0.3) 230deg, rgba(255,255,255,0) 320deg); filter: blur(5px); -webkit-mask: radial-gradient(circle, transparent 55%, #000 100%); mask: radial-gradient(circle, transparent 55%, #000 100%); pointer-events: none; }
.frame-item.active .frame { transform: scale(1.12); box-shadow: inset 0 1px 1px rgba(255,255,255,0.7), inset 0 -3px 8px rgba(255,255,255,0.25), inset 0 0 12px rgba(0,0,0,0.04), 0 4px 18px rgba(0,0,0,0.10), 0 0 26px rgba(0,196,140,0.18); }
.frame svg { position: absolute; inset: 0; margin: auto; width: 28px; height: 28px; color: var(--text-3); }
.frame-item.active .frame svg { color: var(--accent-text); }
.hint { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.hint .key { display: inline-block; background: var(--accent-glass); color: var(--accent-text); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <section class="changelog">
    <div class="cl-title" id="clTitle">更新日志 CHANGELOG</div>
    <div class="cl-ver" id="clVer"></div>
    <ul class="cl-list" id="clList"></ul>
  </section>

  <div class="sec-title" id="secTitle">聚焦选框 EGDSpotIndicator · 空框 + 选中放大</div>
  <div class="stage">
    <div class="frame-item active" id="itemA">
      <div class="frame" role="button" tabindex="0" data-item="A"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>
    </div>
    <div class="frame-item" id="itemB">
      <div class="frame" role="button" tabindex="0" data-item="B"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3 8 9l4 13 4-13-2.5-6"/><path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z"/><path d="M2 9h20"/></svg></div>
    </div>
  </div>
  <div class="hint" id="hint">点击图标 → 选中放大 <span class="key">1.12×</span> · 翠绿高光边</div>
</main>

<script>
(function () {
  'use strict';
  var I18N = {
    zh: {
      clTitle: '更新日志 CHANGELOG',
      clVer: 'v1.0 <span class="tag">空框聚焦</span><span class="cl-date">2026-10-24</span>',
      clItems: ['聚焦选框原子件 v1.0「空框聚焦」：透明液态玻璃空选框（无描边·边缘棱镜折射），选中放大 1.12×、中性亮边、弹性过渡', '极简边界：只做空框 + 放大；位移交给 AnimatedAlign/AnimatedPositioned，切换逻辑由组合件控制'],
      secTitle: '聚焦选框 EGDSpotIndicator · 空框 + 选中放大',
      hint: '点击图标 → 选中放大 <span class="key">1.12×</span> · 玻璃折射'
    },
    en: {
      clTitle: 'CHANGELOG',
      clVer: 'v1.0 <span class="tag">Empty Focus Frame</span><span class="cl-date">2026-10-24</span>',
      clItems: ['Focus-frame atom v1.0 "Empty Focus Frame": translucent liquid-glass frame (no border, prism refraction at edge), scales 1.12× when active, neutral rim, elastic transition', 'Minimal: frame + scale only; movement via AnimatedAlign/AnimatedPositioned, switch logic by composite'],
      secTitle: 'Focus Frame EGDSpotIndicator · empty frame + active scale',
      hint: 'Click an icon → scales <span class="key">1.12×</span> · glass refraction'
    }
  };
  var lang = 'zh';
  var btns = Array.prototype.slice.call(document.getElementById('langToggle').querySelectorAll('button'));
  var items = Array.prototype.slice.call(document.querySelectorAll('.frame-item'));
  var frames = Array.prototype.slice.call(document.querySelectorAll('.frame'));
  frames.forEach(function (f) {
    f.addEventListener('click', function () {
      items.forEach(function (it) { it.classList.toggle('active', it === f.parentElement); });
    });
    f.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); f.click(); }
    });
  });
  function render() {
    var d = I18N[lang];
    document.getElementById('clTitle').textContent = d.clTitle;
    document.getElementById('clVer').innerHTML = d.clVer;
    document.getElementById('clList').innerHTML = d.clItems.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    document.getElementById('secTitle').textContent = d.secTitle;
    document.getElementById('hint').innerHTML = d.hint;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); }); });
  render();
})();
</script>
</body>
</html>
