<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD ScrollHide v1.0</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype");
  font-weight: 500 700; font-display: swap;
}
:root {
  --bg: #FFFFFF; --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
  --accent: #00C48C; --accent-text: #007A55; --accent-glass: rgba(0,196,140,0.14);
  --accent-border: rgba(0,196,140,0.25);
  --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(0,0,0,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --font: "LXGW WenKai", "霞鹜文楷", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 20px 20px; }
.lang-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-highlight); margin-bottom: 20px; }
.lang-toggle button { border: none; background: transparent; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-glass); border: 0.5px solid var(--accent-border); color: var(--accent-text); }
.changelog { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 16px 20px; margin-bottom: 24px; }
.cl-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 1px; margin-bottom: 12px; }
.cl-ver { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cl-ver .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-glass); border: 0.5px solid var(--accent-border); border-radius: 999px; padding: 1px 8px; }
.cl-date { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.cl-list { list-style: none; }
.cl-list li { font-size: 13.5px; color: var(--text-2); line-height: 1.7; padding-left: 14px; position: relative; }
.cl-list li::before { content: ''; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.sec-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
.scroll-stage { position: relative; height: 360px; overflow-y: auto; border-radius: 24px; background: #F5F5F7; border: 0.5px solid #E5E5EA; overscroll-behavior: contain; }
.content { padding: 18px 18px 90px; }
.para { font-size: 14px; color: var(--text-2); line-height: 1.9; margin-bottom: 18px; }
.hide-target { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 2px dashed var(--accent); font-size: 13px; font-weight: 700; color: var(--accent-text); box-shadow: 0 6px 20px rgba(0,0,0,0.10); transition: transform 300ms ease-out, opacity 300ms ease-out; }
.hide-target.hidden { transform: translateY(180%); opacity: 0; }
.hide-target svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <section class="changelog">
    <div class="cl-title" id="clTitle">更新日志 CHANGELOG</div>
    <div class="cl-ver" id="clVer"></div>
    <ul class="cl-list" id="clList"></ul>
  </section>

  <div class="sec-title" id="secTitle">滚动折叠 · 下滑隐藏 / 上滑展开</div>
  <div class="scroll-stage" id="scrollStage">
    <div class="content" id="content"></div>
    <div class="hide-target" id="hideTarget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span id="htLabel">滚动折叠目标</span>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var I18N = {
    zh: {
      clTitle: '更新日志 CHANGELOG',
      clVer: 'v1.0 <span class="tag">折叠独立</span><span class="cl-date">2026-10-13</span>',
      clItems: ['滚动折叠原子件 v1.0「折叠独立」：上下滑动浏览内容时隐藏/展开，阈值可调，状态回调'],
      secTitle: '滚动折叠 · 下滑隐藏 / 上滑展开',
      htLabel: '滚动折叠目标',
      lines: ['示例内容 · 向下滚动。', '示例内容 · 继续向下。', '示例内容 · 再向下滑，底部条收起。', '示例内容 · 向上回滚，底部条重新展开。', '示例内容 · 阈值可调、方向可控、状态可回调。']
    },
    en: {
      clTitle: 'CHANGELOG',
      clVer: 'v1.0 <span class="tag">Collapse Standalone</span><span class="cl-date">2026-10-13</span>',
      clItems: ['Scroll-hide atom v1.0 "Collapse Standalone": hide/expand on content scroll, adjustable threshold, state callback'],
      secTitle: 'Scroll Hide · hide on scroll down / show on scroll up',
      htLabel: 'Scroll-hide target',
      lines: ['Sample content · scroll down.', 'Sample content · keep going down.', 'Sample content · scroll further, the bar collapses.', 'Sample content · scroll back up, the bar returns.', 'Sample content · adjustable threshold, direction, state callback.']
    }
  };
  var lang = 'zh';
  var btns = Array.prototype.slice.call(document.getElementById('langToggle').querySelectorAll('button'));
  var stage = document.getElementById('scrollStage');
  var target = document.getElementById('hideTarget');
  var content = document.getElementById('content');
  var lastOffset = 0, accumulated = 0, isHidden = false;

  // 生成足够多的占位段落，确保内容超出可视区、可以滚动
  function fillContent() {
    var d = I18N[lang];
    content.innerHTML = '';
    for (var i = 0; i < 18; i++) {
      var p = document.createElement('p');
      p.className = 'para';
      p.textContent = (i + 1) + '. ' + d.lines[i % d.lines.length];
      content.appendChild(p);
    }
  }

  stage.addEventListener('scroll', function () {
    var now = stage.scrollTop;
    var delta = now - lastOffset;
    lastOffset = now;
    if (delta < 0) {
      accumulated = 0;
      if (isHidden) setHidden(false);
    } else if (delta > 0) {
      accumulated += delta;
      if (!isHidden && accumulated > 80) { setHidden(true); accumulated = 0; }
    }
  });
  function setHidden(v) {
    isHidden = v;
    target.classList.toggle('hidden', v);
  }
  function render() {
    var d = I18N[lang];
    document.getElementById('clTitle').textContent = d.clTitle;
    document.getElementById('clVer').innerHTML = d.clVer;
    document.getElementById('clList').innerHTML = d.clItems.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    document.getElementById('secTitle').textContent = d.secTitle;
    document.getElementById('htLabel').textContent = d.htLabel;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
    fillContent();
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); });
  });
  render();
})();
</script>
</body>
</html>
