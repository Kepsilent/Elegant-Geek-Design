<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD SplitNavBar v1.0</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype");
  font-weight: 500 700; font-display: swap;
}
:root {
  --bg: #FFFFFF; --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
  --accent: #00C48C; --accent-text: #007A55; --accent-glass: rgba(0,196,140,0.14);
  --accent-border: rgba(0,196,140,0.25);
  --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(0,0,0,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --font: "LXGW WenKai", "霞鹜文楷", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 140px; }
.lang-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-highlight); margin-bottom: 20px; }
.lang-toggle button { border: none; background: transparent; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-glass); border: 0.5px solid var(--accent-border); color: var(--accent-text); }
.changelog { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 16px 20px; margin-bottom: 24px; }
.cl-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 1px; margin-bottom: 12px; }
.cl-ver { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cl-ver .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-glass); border: 0.5px solid var(--accent-border); border-radius: 999px; padding: 1px 8px; }
.cl-date { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.cl-list { list-style: none; }
.cl-list li { font-size: 13.5px; color: var(--text-2); line-height: 1.7; padding-left: 14px; position: relative; }
.cl-list li::before { content: ''; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.sec-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
.page-panel { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 18px 20px; margin-bottom: 16px; min-height: 120px; }
.page-panel .pn { font-size: 18px; font-weight: 700; }
.page-panel .pn .ac { color: var(--accent-text); }
.page-panel .pd { margin-top: 6px; font-size: 13px; color: var(--text-2); }
.switch-panel { border-radius: 18px; background: #F5F5F7; border: 0.5px solid #E5E5EA; padding: 8px 16px; }
.sw-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid rgba(0,0,0,0.06); }
.sw-row:last-child { border-bottom: none; }
.sw-row .sw-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.sw-row .sw-label small { font-weight: 400; color: var(--text-3); margin-left: 6px; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: rgba(0,0,0,0.15); transition: background 200ms ease; cursor: pointer; flex-shrink: 0; }
.switch.on { background: var(--accent); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: left 200ms ease; }
.switch.on .knob { left: 21px; }
/* 分离式导航 */
.bg-decor { position: fixed; left: 0; right: 0; bottom: 0; height: 190px; z-index: 90; pointer-events: none; background: linear-gradient(180deg, transparent 0%, rgba(0,196,140,0.08) 55%, rgba(0,196,140,0.16) 100%); }
.bg-decor::before { content: ''; position: absolute; left: 12%; right: 12%; bottom: 34px; height: 130px; border-radius: 50%; background: conic-gradient(from 180deg, rgba(0,196,140,0.28), rgba(74,144,226,0.22), rgba(0,196,140,0.28)); filter: blur(28px); }
.bg-decor::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: 56px; height: 70px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,0.5), transparent 70%); filter: blur(16px); }
.split-nav { position: fixed; bottom: 20px; left: 0; right: 0; height: 0; z-index: 100; pointer-events: none; }
.split-nav .nav-el { position: absolute; bottom: 0; width: 64px; height: 64px; border-radius: 50%; pointer-events: auto; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--accent-text); background: rgba(255,255,255,0.14); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.55), inset 0 -2px 6px rgba(255,255,255,0.15), 0 6px 20px rgba(0,0,0,0.10); user-select: none; -webkit-user-select: none; transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1); }
.split-nav .nav-el.pressed { transform: scale(1.08); }
.split-nav .nav-el svg { width: 26px; height: 26px; }
.split-nav .nav-el.left { left: 24px; }
.split-nav .nav-el.right { right: 24px; }
/* 空选框：水滴放大镜——罩在选中按钮上层，内部图标放大（1.35×），玻璃凸起+水滴高光+边缘棱镜折射 */
.split-nav .indicator { position: absolute; z-index: 2; bottom: -4px; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.10); backdrop-filter: blur(18px) saturate(190%) brightness(1.10); -webkit-backdrop-filter: blur(18px) saturate(190%) brightness(1.10); transform: scale(1.08); box-shadow: inset 0 2px 3px rgba(255,255,255,0.8), inset 0 -4px 10px rgba(255,255,255,0.25), inset 0 0 16px rgba(0,0,0,0.04), 0 10px 30px rgba(0,0,0,0.14), 0 0 30px rgba(0,196,140,0.16); pointer-events: none; transition: left 420ms cubic-bezier(0.34,1.56,0.64,1), transform 300ms cubic-bezier(0.34,1.56,0.64,1); }
.split-nav .indicator::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 210deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.5) 45deg, rgba(255,255,255,0.06) 100deg, rgba(255,255,255,0) 180deg, rgba(255,255,255,0.35) 230deg, rgba(255,255,255,0) 320deg); filter: blur(5px); -webkit-mask: radial-gradient(circle, transparent 55%, #000 100%); mask: radial-gradient(circle, transparent 55%, #000 100%); pointer-events: none; }
.split-nav .indicator::after { content: ''; position: absolute; top: 13px; left: 17px; width: 16px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.9); filter: blur(2.5px); transform: rotate(-16deg); }
.split-nav .indicator .mag { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.split-nav .indicator .mag svg { width: 35px; height: 35px; color: var(--accent-text); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.10)); }
.hint { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.hint .key { display: inline-block; background: var(--accent-glass); color: var(--accent-text); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="bg-decor" aria-hidden="true"></div>
<main class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <section class="changelog">
    <div class="cl-title" id="clTitle">更新日志 CHANGELOG</div>
    <div class="cl-ver" id="clVer"></div>
    <ul class="cl-list" id="clList"></ul>
  </section>

  <div class="sec-title" id="secTitle">分离式悬浮导航栏 EGDSplitNavBar · 原子拼装</div>
  <div class="page-panel">
    <div class="pn"><span class="pg-label" id="pgLabel">示例</span> <span class="ac" id="pgIdx">A</span></div>
    <div class="pd" id="pgDesc">当前界面 · 由分离式导航切换</div>
  </div>
  <div class="switch-panel">
    <div class="sw-row"><span class="sw-label" id="l1">玻璃层 <small id="l1s">EGDLiquidGlass</small></span><div class="switch on" data-feat="glass"><div class="knob"></div></div></div>
    <div class="sw-row"><span class="sw-label" id="l2">指示器层 <small id="l2s">EGDSpotIndicator</small></span><div class="switch on" data-feat="indicator"><div class="knob"></div></div></div>
  </div>
  <div class="hint" id="hint">点击左右圆钮 → 空选框跨屏弹性移动</div>
</main>

<div class="split-nav" id="splitNav">
  <div class="indicator" id="indicator"><div class="mag" id="magA"></div></div>
  <div class="nav-el left" id="navA" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>
  <div class="nav-el right" id="navB" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3 8 9l4 13 4-13-2.5-6"/><path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z"/><path d="M2 9h20"/></svg></div>
</div>

<script>
(function () {
  'use strict';
  var I18N = {
    zh: {
      clTitle: '更新日志 CHANGELOG',
      clVer: 'v1.0 <span class="tag">分离拼装</span><span class="cl-date">2026-10-24</span>',
      clItems: ['分离式悬浮导航栏组合件 v1.0「分离拼装」：EGDSpot × 2 + EGDSpotIndicator + EGDLiquidGlass', '空选框跨屏弹性移动（AnimatedPositioned + easeOutBack 420ms）；指示器为无描边透明玻璃（边缘棱镜折射）；受控：外部持有 selectedIndex / onIndexChanged'],
      secTitle: '分离式悬浮导航栏 EGDSplitNavBar · 原子拼装',
      pgLabel: '示例', pgA: '当前界面 A · 由分离式导航切换', pgB: '当前界面 B · 由分离式导航切换',
      l1: '玻璃层', l2: '指示器层',
      hint: '点击左右圆钮 → 空选框跨屏弹性移动'
    },
    en: {
      clTitle: 'CHANGELOG',
      clVer: 'v1.0 <span class="tag">Split Assembly</span><span class="cl-date">2026-10-24</span>',
      clItems: ['Split floating nav composite v1.0 "Split Assembly": EGDSpot × 2 + EGDSpotIndicator + EGDLiquidGlass', 'Frame glides across screen elastically (AnimatedPositioned + easeOutBack 420ms); indicator is a borderless translucent glass with prism refraction at edge; controlled: external selectedIndex / onIndexChanged'],
      secTitle: 'Split Floating Nav Bar EGDSplitNavBar · atom assembly',
      pgLabel: 'Example', pgA: 'Page A · switched by split nav', pgB: 'Page B · switched by split nav',
      l1: 'Glass layer', l2: 'Indicator layer',
      hint: 'Tap left/right button → the frame glides across elastically'
    }
  };
  var lang = 'zh';
  var btns = Array.prototype.slice.call(document.getElementById('langToggle').querySelectorAll('button'));
  var feats = { glass: true, indicator: true };
  var sel = 0;
  var indicator = document.getElementById('indicator');
  var navA = document.getElementById('navA');
  var navB = document.getElementById('navB');

  function applyIndicator() {
    if (!feats.indicator) { indicator.style.display = 'none'; return; }
    indicator.style.display = '';
    var left = sel === 0 ? 20 : (window.innerWidth - 20 - 72);
    indicator.style.left = left + 'px';
  }
  function applyGlass() {
    var els = [navA, navB];
    els.forEach(function (el) {
      el.style.background = feats.glass ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.85)';
      el.style.backdropFilter = feats.glass ? 'blur(16px) saturate(180%)' : 'none';
      el.style.webkitBackdropFilter = feats.glass ? 'blur(16px) saturate(180%)' : 'none';
    });
  }
  function select(i) {
    sel = i;
    applyIndicator();
    var mag = document.getElementById('magA');
    if (mag) { mag.innerHTML = i === 0 ? navA.innerHTML : navB.innerHTML; }
    var d = I18N[lang];
    document.getElementById('pgIdx').textContent = sel === 0 ? 'A' : 'B';
    document.getElementById('pgDesc').textContent = sel === 0 ? d.pgA : d.pgB;
  }
  function press(el, v) { el.classList.toggle('pressed', v); }
  navA.addEventListener('pointerdown', function () { press(navA, true); });
  navA.addEventListener('pointerup', function () { press(navA, false); select(0); });
  navA.addEventListener('pointercancel', function () { press(navA, false); });
  navB.addEventListener('pointerdown', function () { press(navB, true); });
  navB.addEventListener('pointerup', function () { press(navB, false); select(1); });
  navB.addEventListener('pointercancel', function () { press(navB, false); });

  var switches = Array.prototype.slice.call(document.querySelectorAll('.switch[data-feat]'));
  switches.forEach(function (s) {
    s.addEventListener('click', function () {
      var k = s.getAttribute('data-feat');
      feats[k] = !feats[k];
      s.classList.toggle('on', feats[k]);
      applyIndicator(); applyGlass();
    });
  });

  function render() {
    var d = I18N[lang];
    document.getElementById('clTitle').textContent = d.clTitle;
    document.getElementById('clVer').innerHTML = d.clVer;
    document.getElementById('clList').innerHTML = d.clItems.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    document.getElementById('secTitle').textContent = d.secTitle;
    document.getElementById('pgLabel').textContent = d.pgLabel;
    document.getElementById('l1').innerHTML = d.l1 + ' <small>EGDLiquidGlass</small>';
    document.getElementById('l2').innerHTML = d.l2 + ' <small>EGDSpotIndicator</small>';
    document.getElementById('hint').innerHTML = d.hint;
    select(sel);
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); }); });
  window.addEventListener('resize', applyIndicator);
  render();
  select(0);
  applyIndicator(); applyGlass();
})();
</script>
</body>
</html>
