<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGD Sticker v1.0</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype");
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "LXGW WenKai";
  src: url("../../../../assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype");
  font-weight: 500 700; font-display: swap;
}
:root {
  --bg: #FFFFFF; --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
  --accent: #00C48C; --accent-text: #007A55; --accent-glass: rgba(0,196,140,0.14);
  --accent-border: rgba(0,196,140,0.25);
  --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(0,0,0,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --font: "LXGW WenKai", "霞鹜文楷", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
.lang-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-highlight); margin-bottom: 20px; }
.lang-toggle button { border: none; background: transparent; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-glass); border: 0.5px solid var(--accent-border); color: var(--accent-text); }
.changelog { border-radius: 18px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-highlight); padding: 16px 20px; margin-bottom: 24px; }
.cl-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: 1px; margin-bottom: 12px; }
.cl-ver { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.cl-ver .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-glass); border: 0.5px solid var(--accent-border); border-radius: 999px; padding: 1px 8px; }
.cl-date { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
.cl-list { list-style: none; }
.cl-list li { font-size: 13.5px; color: var(--text-2); line-height: 1.7; padding-left: 14px; position: relative; }
.cl-list li::before { content: ''; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.sec-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
.stage { border-radius: 24px; background: linear-gradient(135deg, #FDF3F4 0%, #F8ECEF 50%, #F3E4EA 100%); border: 0.5px solid #F0DDE2; padding: 36px 20px; display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; min-height: 240px; }
.sticker { position: relative; width: 92px; height: 92px; border-radius: 26px; display: flex; align-items: center; justify-content: center; }
.sticker .bg { position: absolute; inset: 0; border-radius: 26px; background: #FFFFFF; border: 1px solid rgba(255,255,255,0.9); }
.sticker.soft .bg { box-shadow: 0 10px 24px rgba(0,0,0,0.14), 0 4px 8px rgba(0,0,0,0.06), 0 1px 0 rgba(255,255,255,1); }
.sticker.fluffy .bg { box-shadow: 0 18px 30px rgba(0,0,0,0.16), 0 8px 12px rgba(0,0,0,0.08), 0 3px 4px rgba(0,0,0,0.06), 0 1px 0 rgba(255,255,255,1); }
.sticker svg { position: relative; width: 40px; height: 40px; color: var(--accent-text); }
.sticker.pink svg { color: #D8648C; }
.sticker.violet svg { color: #8B7CF6; }
.sticker.amber svg { color: #E8A13D; }
.hint { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.hint .key { display: inline-block; background: var(--accent-glass); color: var(--accent-text); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <section class="changelog">
    <div class="cl-title" id="clTitle">更新日志 CHANGELOG</div>
    <div class="cl-ver" id="clVer"></div>
    <ul class="cl-list" id="clList"></ul>
  </section>

  <div class="sec-title" id="secTitle">贴纸装饰 EGDSticker · 软糯毛绒 / 贴纸质感</div>
  <div class="stage">
    <div class="sticker soft"><div class="bg"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg></div>
    <div class="sticker fluffy pink"><div class="bg"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>
    <div class="sticker fluffy violet"><div class="bg"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/></svg></div>
    <div class="sticker soft amber"><div class="bg"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg></div>
  </div>
  <div class="hint" id="hint">左/右为贴纸质感 · 中为<span class="key">毛绒蓬松</span>质感（多层柔和投影）</div>
</main>

<script>
(function () {
  'use strict';
  var I18N = {
    zh: {
      clTitle: '更新日志 CHANGELOG',
      clVer: 'v1.0 <span class="tag">贴纸质感</span><span class="cl-date">2026-10-24</span>',
      clItems: ['贴纸装饰原子件 v1.0「贴纸质感」：边框 + 软投影 + 可选毛绒蓬松（多层柔和投影）', '灵感来自 3D 软糯植绒贴纸：边缘微蓬、轻阴影、软糯贴肤；只做装饰层，内容外部提供'],
      secTitle: '贴纸装饰 EGDSticker · 软糯毛绒 / 贴纸质感',
      hint: '左/右为贴纸质感 · 中为<span class="key">毛绒蓬松</span>质感（多层柔和投影）'
    },
    en: {
      clTitle: 'CHANGELOG',
      clVer: 'v1.0 <span class="tag">Sticker Texture</span><span class="cl-date">2026-10-24</span>',
      clItems: ['Sticker decor atom v1.0 "Sticker Texture": border + soft shadow + optional fluffy (layered soft shadows)', 'Inspired by 3D soft flock stickers: puffy edges, light shadow, soft to the touch; decoration only, content external'],
      secTitle: 'Sticker Decor EGDSticker · soft fluffy / sticker texture',
      hint: 'Sides: sticker texture · middle: <span class="key">fluffy puffy</span> (layered soft shadows)'
    }
  };
  var lang = 'zh';
  var btns = Array.prototype.slice.call(document.getElementById('langToggle').querySelectorAll('button'));
  function render() {
    var d = I18N[lang];
    document.getElementById('clTitle').textContent = d.clTitle;
    document.getElementById('clVer').innerHTML = d.clVer;
    document.getElementById('clList').innerHTML = d.clItems.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    document.getElementById('secTitle').textContent = d.secTitle;
    document.getElementById('hint').innerHTML = d.hint;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); render(); }); });
  render();
})();
</script>
</body>
</html>
